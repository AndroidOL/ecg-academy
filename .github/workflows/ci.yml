name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  content-engine:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecg_academy
          MYSQL_USER: ecg_app
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content
        run: php scripts/validate_content.php
      - name: Validate 2000-case question bank
        run: php scripts/validate_bank.php
      - name: Validate review ledger
        run: php scripts/validate_review.php
      - name: Validate section question bank
        run: php scripts/validate_section_bank.php
      - name: Audit section answer accuracy
        run: php scripts/audit_section_bank.php
      - name: Validate special practice questions
        run: php scripts/validate_special_questions.php
      - name: Prepare integration database
        run: |
          cat > app/config.local.php <<'PHP'
          <?php
          return ['db' => ['host' => '127.0.0.1', 'port' => 3306, 'database' => 'ecg_academy', 'user' => 'ecg_app', 'password' => 'testpass', 'charset' => 'utf8mb4']];
          PHP
          php scripts/migrate.php
      - name: Simulator integration test
        run: php tests/sim.test.php
      - name: Assignment integration test
        run: php tests/assignment.test.php
      - name: Learning and exam integration test
        run: php tests/learning.test.php
      - name: Special practice integration test
        run: php tests/special.test.php
      - name: Leaderboard integration test
        run: php tests/leaderboard.test.php
      - name: Validate multi-hundred-chapter curriculum
        run: php scripts/validate_curriculum.php
      - name: Lint PHP
        run: find app scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Install test DOM
        run: npm install --no-audit --no-fund
      - name: ECG engine tests
        run: npm run test:engine
      - name: Playback and annotation tests
        run: npm run test:playback
      - name: Local review and BYOK tests
        run: npm run test:study
